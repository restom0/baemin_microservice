input {
  gelf {
    port => 12201
  }

  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if ![service] {
    if [tag] {
      mutate {
        add_field => {
          "service" => "%{tag}"
        }
      }
    } else if [container_name] {
      mutate {
        add_field => {
          "service" => "%{container_name}"
        }
      }
    } else {
      mutate {
        add_field => {
          "service" => "baemin"
        }
      }
    }
  }

  mutate {
    add_field => {
      "environment" => "${BAEMIN_ENV:local}"
      "stack" => "baemin"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "baemin-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
