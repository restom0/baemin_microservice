sonar.projectKey=baemin_microservice
sonar.projectName=Baemin Microservices
sonar.sourceEncoding=UTF-8

# One aggregated analysis over every service's src tree.
sonar.sources=api-gateway/src,user-service/src,products-service/src,order-service/src,shipping-service/src,notify-service/src
sonar.tests=api-gateway/src,user-service/src,products-service/src,order-service/src,shipping-service/src,notify-service/src
sonar.test.inclusions=**/*.spec.ts

# Bootstrap and DI wiring are excluded from analysis and coverage.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/main.ts,**/*.module.ts,**/*.spec.ts
sonar.coverage.exclusions=**/main.ts,**/*.module.ts,**/*.spec.ts

# Coverage is downloaded from the CI matrix into coverage-artifacts/coverage-<service>/lcov.info.
sonar.javascript.lcov.reportPaths=coverage-artifacts/coverage-api-gateway/lcov.info,coverage-artifacts/coverage-user-service/lcov.info,coverage-artifacts/coverage-products-service/lcov.info,coverage-artifacts/coverage-order-service/lcov.info,coverage-artifacts/coverage-shipping-service/lcov.info,coverage-artifacts/coverage-notify-service/lcov.info
